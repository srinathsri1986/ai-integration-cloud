name: Deploy

on:
  push:
    branches:
      - main      # → staging auto-deploy
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false  # Never cancel an in-flight deploy

jobs:
  # ── CI gate ─────────────────────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Build & push images ─────────────────────────────────────────────────────
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      id-token: write   # OIDC token for AWS authentication
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ────────────────────────────────────────────────────────────
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.API_ECR_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.API_ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Web image ────────────────────────────────────────────────────────────
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.WEB_ECR_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.WEB_ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.API_BASE_URL }}

  # ── Terraform plan/apply ─────────────────────────────────────────────────────
  terraform:
    name: Terraform (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: build-push

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ github.event.inputs.environment || 'staging' }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init -backend-config=environments/${{ env.TF_ENV }}/backend.hcl

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=environments/${{ env.TF_ENV }}/terraform.tfvars \
            -var="api_image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -var="web_image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ── ECS rolling deploy ────────────────────────────────────────────────────────
  deploy-ecs:
    name: Deploy to ECS (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: [build-push, terraform]

    permissions:
      id-token: write
      contents: read

    env:
      TF_ENV: ${{ github.event.inputs.environment || 'staging' }}
      APP_PREFIX: aic-${{ github.event.inputs.environment || 'staging' }}
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Update API service ──────────────────────────────────────────────────
      - name: Render new API task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.APP_PREFIX }}-api
          container-name: api
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.API_ECR_REPO }}:${{ env.IMAGE_TAG }}

      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: ${{ env.APP_PREFIX }}-api
          cluster: ${{ env.APP_PREFIX }}-cluster
          wait-for-service-stability: true

      # ── Update Web service ──────────────────────────────────────────────────
      - name: Render new Web task definition
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.APP_PREFIX }}-web
          container-name: web
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.WEB_ECR_REPO }}:${{ env.IMAGE_TAG }}

      - name: Deploy Web to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: ${{ env.APP_PREFIX }}-web
          cluster: ${{ env.APP_PREFIX }}-cluster
          wait-for-service-stability: true

      # ── Update Celery service ───────────────────────────────────────────────
      - name: Render new Celery task definition
        id: celery-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.APP_PREFIX }}-celery
          container-name: celery
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.API_ECR_REPO }}:${{ env.IMAGE_TAG }}

      - name: Deploy Celery to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.celery-task-def.outputs.task-definition }}
          service: ${{ env.APP_PREFIX }}-celery
          cluster: ${{ env.APP_PREFIX }}-cluster
          wait-for-service-stability: true
