[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netsuite-cfo-api"
version = "0.1.0"
description = "FastAPI backend for the NetSuite CFO Intelligence Orchestrator MVP."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.3",
  "python-json-logger>=3.2.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "bcrypt>=4.0.0",
  "python-jose[cryptography]>=3.3.0",
  "resend>=2.0.0",
  "python-multipart>=0.0.9",
  "pydantic[email]>=2.0.0",
  "celery[redis]>=5.4.0",
  "croniter>=2.0.0",
  "alembic>=1.14.0",
  "slack_sdk>=3.27.0",
  "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
