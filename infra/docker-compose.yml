services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfo_orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-cfo_app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cfo_app:local_dev_password@postgres:5432/cfo_orchestrator}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NETSUITE_ACCOUNT_ID: ${NETSUITE_ACCOUNT_ID:-placeholder-account}
      NETSUITE_BASE_URL: ${NETSUITE_BASE_URL:-}
      NETSUITE_CONSUMER_KEY: ${NETSUITE_CONSUMER_KEY:-}
      NETSUITE_CONSUMER_SECRET: ${NETSUITE_CONSUMER_SECRET:-}
      NETSUITE_MODE: ${NETSUITE_MODE:-mock}
      NETSUITE_TIMEOUT_SECONDS: ${NETSUITE_TIMEOUT_SECONDS:-15}
      NETSUITE_TOKEN_ID: ${NETSUITE_TOKEN_ID:-}
      NETSUITE_TOKEN_SECRET: ${NETSUITE_TOKEN_SECRET:-}
      # Future hardening: replace local env secret values with Docker secrets or vault references.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PLACEHOLDER_JWT_SECRET: ${PLACEHOLDER_JWT_SECRET:-local-dev-only}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery-beat:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cfo_app:local_dev_password@postgres:5432/cfo_orchestrator}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      NETSUITE_MODE: ${NETSUITE_MODE:-mock}
      PLACEHOLDER_JWT_SECRET: ${PLACEHOLDER_JWT_SECRET:-local-dev-only}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cfo_app:local_dev_password@postgres:5432/cfo_orchestrator}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NETSUITE_ACCOUNT_ID: ${NETSUITE_ACCOUNT_ID:-placeholder-account}
      NETSUITE_MODE: ${NETSUITE_MODE:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLACEHOLDER_JWT_SECRET: ${PLACEHOLDER_JWT_SECRET:-local-dev-only}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

  mcp-server:
    build:
      context: ..
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      MCP_API_BASE_URL: ${MCP_API_BASE_URL:-http://api:8000}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-netsuite-cfo-intelligence}
    depends_on:
      - api
    profiles:
      - mcp

volumes:
  postgres-data:
  redis-data:
